[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "evalharness"
version = "0.1.0"
description = "Reproducible evaluation harness for hosted LLM APIs: latency, reliability, and rubric quality scoring with charts."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "matplotlib>=3.8", "PyYAML>=5.4"]

[project.scripts]
evalharness = "evalharness.cli:main"

[tool.setuptools.packages.find]
include = ["evalharness*"]
